version: '3.8'

services:
  rain-x-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rain-x-operational-console
    ports:
      # Securely bind to localhost (127.0.0.1) on the host system
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
